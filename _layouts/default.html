<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="layout-{{ page.layout }}">
  {% include header.html %}
  <main class="container main-content">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>

  {%- if page.layout == 'post' -%}
  <!-- Mermaid 图表渲染：把 kramdown 生成的 code.language-mermaid 转为 .mermaid 容器再渲染 -->
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script defer>
    (function () {
      function renderMermaid() {
        if (!window.mermaid) return;
        var nodes = document.querySelectorAll('code.language-mermaid');
        nodes.forEach(function (el) {
          var pre = el.closest('pre') || el.parentNode;
          var div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = el.textContent;
          pre.parentNode.replaceChild(div, pre);
        });
        mermaid.initialize({
          startOnLoad: false,
          theme: 'base',
          securityLevel: 'loose',
          fontFamily: '"Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif',
          themeVariables: {
            primaryColor: '#ffffff',
            primaryTextColor: '#2b2b2b',
            primaryBorderColor: '#1f3a5f',
            lineColor: '#1f3a5f',
            secondaryColor: '#eef2f7',
            tertiaryColor: '#ffffff',
            background: 'transparent',
            mainBkg: '#ffffff',
            nodeBorder: '#1f3a5f',
            clusterBkg: '#eef2f7',
            clusterBorder: '#1f3a5f',
            edgeLabelBackground: '#fbfbf9',
            titleColor: '#1f3a5f'
          }
        });
        mermaid.run();
      }
      if (window.mermaid) { renderMermaid(); }
      else { window.addEventListener('load', renderMermaid); }
    })();
  </script>
  {%- endif -%}
</body>
</html>
